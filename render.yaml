services:
  - type: web
    name: jobguard-ai-api
    env: python
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 300"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SCRAPE_DO_KEY
        generateValue: false
      - key: SCRAPER_API_KEY
        generateValue: false
    healthCheckPath: /health
    autoDeploy: true

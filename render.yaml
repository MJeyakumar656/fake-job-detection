services:
  - type: web
    name: jobguard-ai-api
    env: docker
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SCRAPINGBEE_KEY
        generateValue: false
      - key: SCRAPE_DO_KEY
        generate_value: false
      - key: NLTK_DATA
        value: /usr/local/share/nltk_data
    healthCheckPath: /api/health
    autoDeploy: true

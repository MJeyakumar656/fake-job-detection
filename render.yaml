services:
  - type: web
    name: jobguard-ai-api
    env: docker
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SCRAPINGBEE_KEY
        generateValue: false
    healthCheckPath: /api/health
    autoDeploy: true
